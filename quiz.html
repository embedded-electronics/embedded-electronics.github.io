<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCQ Quiz</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
    <h1>Embedded Electronics MCQ Quiz</h1>
</header>

<main>
    <section class="quiz-grid">
        <div class="quiz-card" onclick="startQuiz(1)">
            <h3>Quiz Set 1</h3>
            <p>30 MCQs - Basic Linux</p>
        </div>
        <div class="quiz-card" onclick="startQuiz(2)">
            <h3>Quiz Set 2</h3>
            <p>30 MCQs - Microcontrollers</p>
        </div>
        <div class="quiz-card" onclick="startQuiz(3)">
            <h3>Quiz Set 3</h3>
            <p>30 MCQs - C Programming</p>
        </div>
        <!-- Add more quiz sets as needed -->
    </section>

    <section id="quiz-container" class="hidden">
        <div id="quiz-questions"></div>
        <button onclick="submitQuiz()">Submit</button>
        <div id="quiz-result"></div>
    </section>
</main>

<footer>
    <p>© 2025 Embedded Electronics</p>
</footer>

<script src="quizData.js"></script>
<script src="quiz.js"></script>
</body>
</html>
