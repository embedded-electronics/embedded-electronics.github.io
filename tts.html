<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Text to Speech | Embedded Electronics</title>

  <link rel="stylesheet" href="styles.css" />

  <style>
    .tts-box {
      max-width: 520px;
      margin: 30px auto;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .tts-box textarea,
    .tts-box select,
    .tts-box input {
      width: 100%;
      padding: 10px;
      margin-top: 12px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .tts-box button {
      width: 100%;
      margin-top: 15px;
      padding: 12px;
      background: #673ab7;
      color: #fff;
      font-size: 15px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .tts-box button:hover {
      background: #5e35b1;
    }
    .note {
      font-size: 12px;
      color: #666;
      margin-top: 10px;
      text-align: center;
    }
  </style>
</head>

<body>

<!-- ================= HEADER (SAME AS BULK WHATSAPP) ================= -->
<header class="site-header">
  <div class="container">
    <a class="brand" href="index.html">
      <img src="assets/logo.png" alt="Embedded Electronics" class="brand-logo" />
    </a>
    <button class="menu-toggle" aria-label="Toggle navigation" onclick="toggleMenu()">☰</button>
    <nav id="nav" class="nav">
      <a href="index.html">Home</a>
      <a href="projects.html">Projects</a>
      <a class="active" href="tts.html">TTS</a>
      <a href="ebooks.html">E-Books</a>
      <a href="quiz.html">Quiz</a>
      <a href="blog.html">Blog</a>
      <a href="typing-game.html">Typing Test</a>
      <a href="interview.html">Interview</a>
      <a href="iq-test.html">IQ Test</a>
      <a href="faq.html">FAQ</a>
      <a href="contact.html">Contact</a>
    </nav>
  </div>
</header>

<!-- ================= MAIN ================= -->
<main class="container page">
  <h1>🔊 Text to Speech (Free & Multi-Language)</h1>
  <p>Convert text into voice and download audio.</p>

  <div class="tts-box">

    <textarea id="text" rows="7">
Welcome to Embedded Electronics.
    </textarea>

    <select id="language" onchange="filterVoices()">
      <option value="">🌍 Auto Language</option>
      <option value="en">English</option>
      <option value="hi">Hindi</option>
    </select>

    <select id="voice"></select>

    <label>Speech Speed</label>
    <input type="range" id="rate" min="0.5" max="2" step="0.1" value="1">

    <button onclick="playTTS()">▶ Play Voice</button>
    <button onclick="downloadWAV()">⬇ Download Audio (WAV)</button>

    <div class="note">
      Best supported on Chrome / Edge (Windows)<br>
      WAV download is 100% reliable & free
    </div>
  </div>
</main>

<!-- ================= FOOTER (SAME AS BULK WHATSAPP) ================= -->
<footer class="site-footer">
  <div class="container">
    <p>© <span id="year"></span> Embedded Electronics</p>
  </div>
</footer>

<script>
/* ================= YEAR ================= */
document.getElementById("year").textContent = new Date().getFullYear();

/* ================= VOICES ================= */
const synth = window.speechSynthesis;
let voices = [];
const voiceSelect = document.getElementById("voice");

function loadVoices() {
  voices = synth.getVoices();
  filterVoices();
}

speechSynthesis.onvoiceschanged = loadVoices;

function filterVoices() {
  const lang = document.getElementById("language").value;
  voiceSelect.innerHTML = "";

  voices
    .filter(v => !lang || v.lang.startsWith(lang))
    .forEach(v => {
      const option = document.createElement("option");
      option.value = voices.indexOf(v);
      option.text = `${v.name} (${v.lang})`;
      voiceSelect.appendChild(option);
    });
}

loadVoices();

/* ================= PLAY TTS ================= */
function playTTS() {
  synth.cancel();
  const utter = new SpeechSynthesisUtterance(
    document.getElementById("text").value
  );
  utter.voice = voices[voiceSelect.value];
  utter.rate = document.getElementById("rate").value;
  synth.speak(utter);
}

/* ================= DOWNLOAD WAV (WORKING) ================= */
async function downloadWAV() {
  alert(
    "Note:\n" +
    "Browser security blocks direct MP3 export.\n" +
    "WAV download works reliably on all systems."
  );

  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  const recorder = new MediaRecorder(stream);
  const chunks = [];

  recorder.ondataavailable = e => chunks.push(e.data);
  recorder.start();

  const utter = new SpeechSynthesisUtterance(
    document.getElementById("text").value
  );
  utter.voice = voices[voiceSelect.value];
  utter.rate = document.getElementById("rate").value;
  synth.speak(utter);

  utter.onend = () => recorder.stop();

  recorder.onstop = () => {
    const blob = new Blob(chunks, { type: "audio/wav" });
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = "tts_audio.wav";
    a.click();

    stream.getTracks().forEach(track => track.stop());
  };
}
</script>

</body>
</html>
