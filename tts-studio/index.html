<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Embedded Electronics TTS Studio</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>Embedded Electronics</h1>
            <p>TTS Studio</p>
        </header>

        <main>

            <section class="card">

                <label for="textInput">Enter Text</label>

                <textarea
                    id="textInput"
                    placeholder="Enter your narration text here..."
                ></textarea>

                <div class="counter">
                    Characters: <span id="charCount">0</span>
                </div>

            </section>


            <section class="card">

                <label for="voice">Voice</label>

                <select id="voice">

                    <option value="en-IN-PrabhatNeural">
                        Male — Prabhat
                    </option>

                    <option value="en-IN-NeerjaNeural">
                        Female — Neerja
                    </option>

                </select>


                <label for="rate">Speech Rate</label>

                <input
                    type="range"
                    id="rate"
                    min="-50"
                    max="50"
                    value="0"
                >

                <span id="rateValue">0%</span>


                <label for="pitch">Pitch</label>

                <input
                    type="range"
                    id="pitch"
                    min="-20"
                    max="20"
                    value="0"
                >

                <span id="pitchValue">0Hz</span>

            </section>


            <section class="controls">

                <button id="generateBtn">
                    Generate MP3
                </button>

                <button id="clearBtn">
                    Clear
                </button>

            </section>


            <section class="card audio-section">

                <h2>Audio Preview</h2>

                <audio
                    id="audioPlayer"
                    controls
                ></audio>

                <a
                    id="downloadBtn"
                    class="download"
                    download="embedded-electronics-tts.mp3"
                >
                    Download MP3
                </a>

            </section>

        </main>


        <footer>
            <p>
                Embedded Electronics © 2026
            </p>
        </footer>

    </div>

    <script type="module" src="script.js"></script>
    
</body>
</html>
