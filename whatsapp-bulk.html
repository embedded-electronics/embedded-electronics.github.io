<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Bulk WhatsApp Message | Embedded Electronics</title>

  <link rel="stylesheet" href="styles.css" />

  <style>
    .bulk-box {
      max-width: 520px;
      margin: 30px auto;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .bulk-box h2 {
      text-align: center;
      margin-bottom: 15px;
    }
    .bulk-box textarea,
    .bulk-box input {
      width: 100%;
      padding: 10px;
      margin-top: 12px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .bulk-box button {
      width: 100%;
      margin-top: 15px;
      padding: 12px;
      background: #25D366;
      color: #fff;
      font-size: 15px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .bulk-box button:hover {
      background: #1ebe5d;
    }
    .note {
      font-size: 12px;
      color: #666;
      margin-top: 10px;
      text-align: center;
    }
  </style>
</head>

<body>

<!-- HEADER -->
<header class="site-header">
  <div class="container">
    <a class="brand" href="index.html">
      <img src="assets/logo.png" alt="Embedded Electronics" class="brand-logo" />
    </a>
    <button class="menu-toggle" onclick="toggleMenu()">☰</button>
    <nav id="nav" class="nav">
      <a href="index.html">Home</a>
      <a href="course.html">Courses</a>
      <a href="ebooks.html">E-Books</a>
      <a href="quiz.html">Quiz</a>
      <a href="contact.html">Contact</a>
      <a class="active" href="whatsapp-bulk.html">WhatsApp</a>
    </nav>
  </div>
</header>

<!-- MAIN -->
<main class="container page">
  <h1>📢 Bulk WhatsApp Message</h1>
  <p>Send a message to multiple WhatsApp numbers (safe method).</p>

  <div class="bulk-box">
    <h2>Bulk WhatsApp Sender</h2>

    <textarea id="numbers" rows="5"
      placeholder="Enter numbers (one per line)
91XXXXXXXXXX
91YYYYYYYYYY"></textarea>

    <textarea id="message" rows="5">
Hello 👋
This is Embedded Electronics.
We offer Embedded Systems training, courses & certification.
Please share more details.
    </textarea>

    <input type="number" id="delay" placeholder="Delay between chats (seconds)" value="3">

    <button onclick="sendBulk()">Send Bulk Messages</button>

    <div class="note">
      WhatsApp Web/App will open for each number. Click Send manually.
    </div>
  </div>
</main>

<!-- FOOTER -->
<footer class="site-footer">
  <div class="container">
    <p>© <span id="year"></span> Embedded Electronics</p>
  </div>
</footer>

<script>
  document.getElementById("year").textContent = new Date().getFullYear();

  function sendBulk() {
    let numbers = document.getElementById("numbers").value.trim().split("\n");
    let message = document.getElementById("message").value.trim();
    let delay = parseInt(document.getElementById("delay").value) * 1000;

    if (!numbers.length || !message) {
      alert("Please enter numbers and message");
      return;
    }

    numbers.forEach((num, index) => {
      num = num.trim();
      if (num) {
        setTimeout(() => {
          let url = "https://wa.me/" + num + "?text=" + encodeURIComponent(message);
          window.open(url, "_blank");
        }, index * delay);
      }
    });
  }
</script>

</body>
</html>
