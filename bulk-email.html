<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Bulk Gmail Sender | Embedded Electronics</title>

  <!-- Main site CSS -->
  <link rel="stylesheet" href="styles.css" />

  <style>
    body {
      background: #f5f7fa;
      font-family: Arial, Helvetica, sans-serif;
    }

    .bulk-box {
      max-width: 520px;
      margin: 30px auto;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .bulk-box h2 {
      text-align: center;
      margin-bottom: 15px;
      color: #1976d2;
    }

    .bulk-box textarea,
    .bulk-box input {
      width: 100%;
      padding: 10px;
      margin-top: 12px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }

    .bulk-box button {
      width: 100%;
      margin-top: 15px;
      padding: 12px;
      background: #1976d2;
      color: #fff;
      font-size: 15px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .bulk-box button:hover {
      background: #0d47a1;
    }

    .note {
      font-size: 12px;
      color: #555;
      margin-top: 10px;
      text-align: center;
      line-height: 1.5;
    }
  </style>
</head>

<body>

<!-- HEADER -->
<header class="site-header">
  <div class="container">
    <a class="brand" href="index.html">
      <img src="assets/logo.png" alt="Embedded Electronics" class="brand-logo" />
    </a>

    <button class="menu-toggle" onclick="toggleMenu()">☰</button>

    <nav id="nav" class="nav">
      <a href="index.html">Home</a>
      <a href="projects.html">Projects</a>
      <a class="active" href="bulk-email.html">Email</a>
      <a href="ebooks.html">E-Books</a>
      <a href="quiz.html">Quiz</a>
      <a href="blog.html">Blog</a>
      <a href="typing-game.html">Typing Test</a>
      <a href="interview.html">Interview</a>
      <a href="iq-test.html">IQ Test</a>
      <a href="faq.html">FAQ</a>
      <a href="contact.html">Contact</a>
    </nav>
  </div>
</header>

<!-- MAIN CONTENT -->
<main class="container page">
  <h1>📧 Bulk Gmail Sender</h1>
  <p>Send emails using Gmail Web (manual & safe).</p>

  <div class="bulk-box">
    <h2>Gmail Bulk Email Tool</h2>

    <textarea id="emails" rows="5"
      placeholder="Enter Gmail IDs (one per line)
example@gmail.com
example2@gmail.com"></textarea>

    <input type="text" id="subject"
      placeholder="Email Subject"
      value="Embedded Electronics – Course Information">

    <textarea id="body" rows="6">
Hello,

This is Embedded Electronics.
We offer Embedded Systems training, courses, and certification.

Please let us know if you are interested.

Regards,
Embedded Electronics Team
    </textarea>

    <input type="number" id="delay" value="3"
      placeholder="Delay between emails (seconds)">

    <button onclick="sendBulkEmail()">Open Gmail Compose</button>

    <div class="note">
      ✔ Gmail must be logged in<br>
      ✔ Each email opens in a new Gmail tab<br>
      ✔ Click <b>Send</b> manually
    </div>
  </div>
</main>

<!-- FOOTER -->
<footer class="site-footer">
  <div class="container">
    <p>© <span id="year"></span> Embedded Electronics</p>
  </div>
</footer>

<!-- SCRIPT -->
<script>
  document.getElementById("year").textContent = new Date().getFullYear();

  function sendBulkEmail() {
    let emails = document.getElementById("emails").value.trim().split("\n");
    let subject = document.getElementById("subject").value.trim();
    let body = document.getElementById("body").value.trim();
    let delay = parseInt(document.getElementById("delay").value) * 1000;

    if (!emails.length || !subject || !body) {
      alert("Please fill all fields");
      return;
    }

    emails.forEach((email, index) => {
      email = email.trim();
      if (email) {
        setTimeout(() => {
          let gmailURL =
            "https://mail.google.com/mail/?view=cm&fs=1" +
            "&to=" + encodeURIComponent(email) +
            "&su=" + encodeURIComponent(subject) +
            "&body=" + encodeURIComponent(body);

          window.open(gmailURL, "_blank");
        }, index * delay);
      }
    });
  }
</script>

</body>
</html>
