<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Embedded Electronics — Quiz</title>
  <link rel="stylesheet" href="styles.css" />
  <script defer src="quiz.js"></script>
</head>
<body>

<!-- Header Start -->
<header class="site-header">
  <div class="container">
    <a class="brand" href="index.html">
      <img src="assets/logo.png" alt="Logo" class="brand-logo" />
    </a>
    <button class="menu-toggle" aria-label="Toggle navigation" onclick="toggleMenu()">☰</button>
    <nav id="nav" class="nav">
      <a href="index.html">Home</a>
      <a href="projects.html">Projects</a>
      <a href="tutorials.html">Tutorials</a>
      <a href="ebooks.html">E-Books</a>
      <a class="active" href="quiz.html">Quiz</a>
      <a href="blog.html">Blog</a>
      <a href="contact.html">Contact</a>
    </nav>
  </div>
</header>
<!-- Header End -->

<main class="container">
  <h1>MCQ Quiz</h1>

  <!-- Quiz Set Selector -->
  <div style="margin-bottom: 20px;">
    <label for="quizSet">Choose Quiz Set:</label>
    <select id="quizSet" onchange="loadQuizSet()">
      <option value="set1">Set 1</option>
      <option value="set2">Set 2</option>
      <option value="set3">Set 3</option>
    </select>
  </div>

  <!-- Quiz Container -->
  <form id="quizForm">
    <div id="quizContainer" class="quiz-grid"></div>
    <button type="submit" class="btn">Submit</button>
  </form>

  <!-- Result -->
  <div id="result" style="margin-top: 20px; font-weight: bold;"></div>
</main>

<!-- Footer Start -->
<footer class="site-footer">
  <div class="container">
    <p>© <span id="year"></span> Embedded Electronics</p>
  </div>
</footer>
<!-- Footer End -->

<style>
.quiz-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
}
.quiz-question {
  border: 1px solid #ccc;
  padding: 10px;
  border-radius: 8px;
  background: #f9f9f9;
}
.quiz-question h3 {
  font-size: 16px;
}
</style>

</body>
</html>
