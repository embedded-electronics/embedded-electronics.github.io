</header>

<main class="container page">
  <header class="page-header">
    <h1>MCQ Quiz</h1>
    <p><!-- MODIFY HERE --> Answer each question and navigate using Next/Previous buttons.</p>
  </header>

  <div class="quiz-meta">
    <label> Name
      <input id="quiz-name" type="text" placeholder="Your full name" />
    </label>
    <label> Time Limit
      <select id="quiz-timer">
        <option value="0">No timer</option>
        <option value="300">5 minutes</option>
        <option value="600" selected>10 minutes</option> <!-- MODIFY HERE -->
        <option value="1200" selected>20 minutes</option> <!-- MODIFY HERE -->
      </select>
    </label>
    <button class="btn" onclick="startQuiz()">Start</button>
    <div id="timer" class="muted" style="display:none">Time left: <span id="timer-display">00:00</span></div>
  </div>

  <form id="quiz-form" onsubmit="return handleSubmit(event)">
    <div id="quiz-container"></div>
    <div class="actions">
      <button class="btn ghost" type="button" id="prev-btn" onclick="prevQuestion()" disabled>Previous</button>
      <button class="btn" type="button" id="next-btn" onclick="nextQuestion()">Next</button>
      <button class="btn" type="submit" id="submit-btn" style="display:none;">Submit</button>
    </div>
  </form>

  <div id="result" class="result"></div>
  <p class="muted">Scores are calculated in your browser. <!-- MODIFY HERE: integrate backend if needed --></p>
</main>

<footer class="site-footer">
  <div class="container">
    <p>© <span id="year"></span> Embedded Electronics</p>
  </div>
</footer>
</body>
