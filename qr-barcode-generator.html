<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>QR & Barcode Generator | Embedded Electronics</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f6f9;
}

.container {
  max-width: 700px;
  margin: 30px auto;
  background: #fff;
  padding: 20px;
  border-radius: 8px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

h1 {
  text-align: center;
}

input, button, select {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  font-size: 14px;
}

button {
  background: #1976d2;
  color: #fff;
  border: none;
  cursor: pointer;
}

button:hover {
  background: #0d47a1;
}

.output {
  margin-top: 20px;
  text-align: center;
}

canvas, svg {
  margin-top: 15px;
}
</style>
</head>

<body>

<div class="container">
<h1>📦 QR & Barcode Generator</h1>

<input type="text" id="text" placeholder="Enter text / URL / Number">

<select id="type">
  <option value="qr">QR Code</option>
  <option value="barcode">Barcode (CODE128)</option>
</select>

<button onclick="generate()">Generate</button>
<button onclick="download()">Download Image</button>

<div class="output">
  <canvas id="qr"></canvas>
  <svg id="barcode"></svg>
</div>
</div>

<!-- QR CODE LIBRARY -->
<script src="https://cdn.jsdelivr.net/npm/qrious@4.0.2/dist/qrious.min.js"></script>

<!-- BARCODE LIBRARY -->
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

<script>
let qr;

function generate() {
  let text = document.getElementById("text").value;
  let type = document.getElementById("type").value;

  if (!text) {
    alert("Please enter text");
    return;
  }

  document.getElementById("qr").style.display = "none";
  document.getElementById("barcode").style.display = "none";

  if (type === "qr") {
    qr = new QRious({
      element: document.getElementById("qr"),
      value: text,
      size: 250
    });
    document.getElementById("qr").style.display = "block";
  } else {
    JsBarcode("#barcode", text, {
      format: "CODE128",
      lineColor: "#000",
      width: 2,
      height: 100,
      displayValue: true
    });
    document.getElementById("barcode").style.display = "block";
  }
}

function download() {
  let type = document.getElementById("type").value;

  if (type === "qr") {
    let canvas = document.getElementById("qr");
    let link = document.createElement("a");
    link.download = "qr-code.png";
    link.href = canvas.toDataURL();
    link.click();
  } else {
    let svg = document.getElementById("barcode");
    let serializer = new XMLSerializer();
    let source = serializer.serializeToString(svg);
    let blob = new Blob([source], { type: "image/svg+xml" });
    let url = URL.createObjectURL(blob);
    let link = document.createElement("a");
    link.href = url;
    link.download = "barcode.svg";
    link.click();
  }
}
</script>

</body>
</html>
