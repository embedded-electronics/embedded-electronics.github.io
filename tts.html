.tts-box button {

}
.note {
  font-size: 12px;
  color: #666;
  margin-top: 10px;
  text-align: center;
}

<!-- MAIN -->
<main class="container page">
<h1>🔊 Text to Speech (Multi-Language)</h1>
<p>Free browser-based TTS with MP3 download.</p>

<div class="tts-box">

<textarea id="text" rows="7">
Welcome to Embedded Electronics.
এম্বেডেড ইলেকট্রনিক্সে আপনাকে স্বাগতম।
</textarea>

<select id="language" onchange="filterVoices()">
  <option value="">🌍 Auto Language</option>
  <option value="en">English</option>
  <option value="hi">Hindi</option>
  <option value="bn">Bengali</option>
</select>

<select id="voice"></select>

<label>Speech Speed</label>
<input type="range" id="rate" min="0.5" max="2" step="0.1" value="1">

<button onclick="playTTS()">▶ Play Voice</button>
<button onclick="downloadMP3()">⬇ Download MP3</button>

<div class="note">
Best experience on Chrome / Edge (Windows)
</div>
</div>
</main>

<!-- FOOTER (SAME AS BULK WHATSAPP) -->
<footer class="site-footer">
  <div class="container">
    <p>© <span id="year"></span> Embedded Electronics</p>
  </div>
</footer>

<script>
document.getElementById("year").textContent = new Date().getFullYear();

const synth = speechSynthesis;
let voices = [];
const voiceSelect = document.getElementById("voice");

function loadVoices(){
  voices = synth.getVoices();
  filterVoices();
}
speechSynthesis.onvoiceschanged = loadVoices;

function filterVoices(){
  const lang = document.getElementById("language").value;
  voiceSelect.innerHTML = "";
  voices.filter(v => !lang || v.lang.startsWith(lang))
        .forEach(v => {
          let opt = document.createElement("option");
          opt.value = voices.indexOf(v);
          opt.text = `${v.name} (${v.lang})`;
          voiceSelect.appendChild(opt);
        });
}

loadVoices();

function playTTS(){
  synth.cancel();
  const u = new SpeechSynthesisUtterance(text.value);
  u.voice = voices[voiceSelect.value];
  u.rate = rate.value;
  synth.speak(u);
}

/* ===== MP3 DOWNLOAD ===== */
async function downloadMP3(){
  const ctx = new AudioContext();
  const dest = ctx.createMediaStreamDestination();
  const recorder = new MediaRecorder(dest.stream);
  const chunks = [];

  recorder.ondataavailable = e => chunks.push(e.data);
  recorder.start();

  const u = new SpeechSynthesisUtterance(text.value);
  u.voice = voices[voiceSelect.value];
  u.rate = rate.value;
  synth.speak(u);

  u.onend = () => recorder.stop();

  recorder.onstop = async () => {
    const blob = new Blob(chunks);
    const buffer = await blob.arrayBuffer();
    const audioBuffer = await ctx.decodeAudioData(buffer);
    const mp3Blob = encodeMP3(audioBuffer);
    download(mp3Blob, "tts_audio.mp3");
  };
}

function encodeMP3(audioBuffer){
  const mp3enc = new lamejs.Mp3Encoder(1, audioBuffer.sampleRate, 128);
  const samples = audioBuffer.getChannelData(0);
  const mp3Data = [];
  for(let i=0;i<samples.length;i+=1152){
    const slice = samples.subarray(i, i+1152);
    const pcm = new Int16Array(slice.length);
    for(let j=0;j<slice.length;j++){
      pcm[j] = Math.max(-1, Math.min(1, slice[j])) * 32767;
    }
    const buf = mp3enc.encodeBuffer(pcm);
    if(buf.length) mp3Data.push(buf);
  }
  const end = mp3enc.flush();
  if(end.length) mp3Data.push(end);
  return new Blob(mp3Data,{type:"audio/mp3"});
}

function download(blob, name){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
}
</script>
