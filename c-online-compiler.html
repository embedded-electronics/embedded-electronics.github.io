<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>C Online Compiler</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: #e5e7eb;
}
header {
  background: #020617;
  padding: 15px;
  text-align: center;
}
.container {
  display: flex;
  flex-wrap: wrap;
  gap: 15px;
  padding: 15px;
}
.editor, .output {
  flex: 1;
  min-width: 300px;
  background: #020617;
  border-radius: 8px;
  padding: 10px;
}
.toolbar button {
  background: #2563eb;
  border: none;
  color: white;
  padding: 6px 12px;
  margin-right: 5px;
  border-radius: 4px;
  cursor: pointer;
}
.toolbar button:hover {
  background: #1d4ed8;
}
textarea {
  width: 100%;
  height: 360px;
  background: #020617;
  color: #e5e7eb;
  border: 1px solid #334155;
  border-radius: 5px;
  font-family: monospace;
  font-size: 14px;
  padding: 10px;
}
pre {
  background: black;
  color: #22c55e;
  padding: 10px;
  height: 360px;
  overflow-y: auto;
  border-radius: 5px;
}
footer {
  text-align: center;
  padding: 10px;
  background: #020617;
  font-size: 14px;
}
</style>
</head>

<body>

<header>
  <h1>🧪 C Online Compiler</h1>
  <p>Practice C programming in your browser</p>
</header>

<div class="container">

  <div class="editor">
    <div class="toolbar">
      <button onclick="runCode()">▶ Run</button>
      <button onclick="clearCode()">🧹 Clear</button>
      <button onclick="loadExample()">📄 Example</button>
    </div>

<textarea id="code">
#include <stdio.h>

int main() {
    printf("Hello, C World!");
    return 0;
}
</textarea>
  </div>

  <div class="output">
    <h3>Output</h3>
    <pre id="result">Program output will appear here...</pre>
  </div>

</div>

<footer>
  © 2025 | Electronics Virtual Lab
</footer>

<script>
function runCode() {
  const code = document.getElementById("code").value;
  let output = "";

  if (!code.includes("main")) {
    output = "Error: main() function not found.";
  }
  else if (code.includes("printf")) {
    const match = code.match(/printf\s*\(\s*"(.*)"\s*\)/);
    output = match ? match[1] : "Program executed successfully.";
  }
  else {
    output = "Program executed successfully.";
  }

  document.getElementById("result").innerText = output;
}

function clearCode() {
  document.getElementById("code").value = "";
  document.getElementById("result").innerText = "";
}

function loadExample() {
  document.getElementById("code").value =
`#include <stdio.h>

int main() {
    int a = 5, b = 7;
    printf("Sum = %d", a + b);
    return 0;
}`;
}
</script>

</body>
</html>
