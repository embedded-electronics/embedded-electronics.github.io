<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MCQ & OMR Sheet Generator</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f6f9;
}

.container {
  max-width: 900px;
  margin: auto;
  background: #fff;
  padding: 20px;
}

h1, h2 {
  text-align: center;
}

input, textarea, button, select {
  width: 100%;
  padding: 8px;
  margin-top: 10px;
}

button {
  background: #1976d2;
  color: #fff;
  border: none;
  cursor: pointer;
}

button:hover {
  background: #0d47a1;
}

/* ===== QUESTION PAPER ===== */
.question {
  margin-bottom: 15px;
}

.options {
  margin-left: 20px;
}

/* ===== OMR ===== */
.omr-header {
  display: flex;
  justify-content: space-between;
  margin-bottom: 20px;
}

.omr-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
}

.omr-row {
  display: flex;
  align-items: center;
  font-size: 14px;
}

.bubble {
  border: 1px solid #000;
  border-radius: 50%;
  width: 18px;
  height: 18px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin: 0 4px;
}

/* PRINT */
@media print {
  body {
    background: #fff;
  }
  button, .controls {
    display: none;
  }
}
</style>
</head>

<body>

<div class="container">

<h1>📝 MCQ & OMR Sheet Generator</h1>

<div class="controls">
  <input type="text" id="title" placeholder="Exam Title (e.g. World Cities and Landmarks)">
  <input type="number" id="count" value="10" placeholder="Number of Questions">
  <button onclick="generatePaper()">Generate Question Paper</button>
  <button onclick="generateOMR()">Generate OMR Sheet</button>
  <button onclick="window.print()">Print / Save as PDF</button>
</div>

<hr>

<div id="output"></div>

</div>

<script>
function generatePaper() {
  let title = document.getElementById("title").value || "MCQ Question Paper";
  let count = document.getElementById("count").value;
  let out = `<h2>${title}</h2>`;

  for (let i = 1; i <= count; i++) {
    out += `
    <div class="question">
      <b>${i}. Sample question number ${i}?</b>
      <div class="options">
        a. Option One<br>
        b. Option Two<br>
        c. Option Three<br>
        d. Option Four
      </div>
    </div>`;
  }

  document.getElementById("output").innerHTML = out;
}

function generateOMR() {
  let count = document.getElementById("count").value;
  let out = `
  <div class="omr-header">
    <div>Name: ____________________</div>
    <div>Date: ____________________</div>
  </div>
  <div class="omr-grid">`;

  for (let i = 1; i <= count; i++) {
    out += `
    <div class="omr-row">
      ${i}.
      <div class="bubble">A</div>
      <div class="bubble">B</div>
      <div class="bubble">C</div>
      <div class="bubble">D</div>
      <div class="bubble">E</div>
    </div>`;
  }

  out += `</div>`;
  document.getElementById("output").innerHTML = out;
}
</script>

</body>
</html>
